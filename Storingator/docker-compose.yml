name: storingator

# Uses the `Storingator/.env` file for values: DB_USERNAME, DB_PASSWORD,
# DB_NAME, SSL_KEY_ALIAS, SSL_KEY_STORE_PASSWORD, REQUIRE_HTTPS, ...
# The keystore must exist at ./secrets/storingator.pkcs12 (see README-less
# instructions: item in .gitignore is `secrets/`).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-storingator}
      POSTGRES_USER: ${DB_USERNAME:-storingator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` here — the DB is never reachable from the host/LAN.
    # Debug via: docker compose exec db psql -U storingator

  app:
    build: .
    image: storingator:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-storingator}
      DB_USERNAME: ${DB_USERNAME:-storingator}
      DB_PASSWORD: ${DB_PASSWORD:?Set a DB_PASSWORD in .env}
      SERVER_PORT: "8443"
      SSL_KEY_ALIAS: ${SSL_KEY_ALIAS:-cloudflare-origin}
      SSL_KEY_STORE: file:/run/secrets/storingator.pkcs12
      SSL_KEY_STORE_PASSWORD: ${SSL_KEY_STORE_PASSWORD:?Set a SSL_KEY_STORE_PASSWORD in .env}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-true}
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
      REGISTRATION_ALLOWED_IPS: ${REGISTRATION_ALLOWED_IPS:-127.0.0.0/8,::1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:*}
    secrets:
      - storingator_pkcs12
    ports:
      - "${BIND_IP:-0.0.0.0}:8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8443'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

secrets:
  storingator_pkcs12:
    file: ./secrets/storingator.pkcs12

volumes:
  pgdata: