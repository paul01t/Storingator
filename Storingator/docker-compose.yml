name: storingator

# Uses the `Storingator/.env` file for values such as DB_PASSWORD and DB_NAME.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${DB_NAME:-storingator}
      POSTGRES_USER: ${DB_USERNAME:-storingator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` here — the DB is never reachable from the host/LAN.
    # Debug via: docker compose exec db psql -U storingator

  app:
    build: .
    image: storingator:local
    restart: unless-stopped
    init: true
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-storingator}
      DB_USERNAME: ${DB_USERNAME:-storingator}
      DB_PASSWORD: ${DB_PASSWORD:?Set a DB_PASSWORD in .env}
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: none
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=25"
      REQUIRE_HTTPS: "false"
      TRUSTED_PROXY_HEADER: X-Real-IP
      REGISTRATION_ALLOWED_IPS: ${REGISTRATION_ALLOWED_IPS:-172.30.0.2/32}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:*}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/cloudflare-origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./secrets/cloudflare-origin-key.pem:/etc/nginx/certs/origin-key.pem:ro
    networks:
      internal:
        ipv4_address: 172.30.0.2

volumes:
  pgdata:

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
