# Resolve the real client address. Cloudflare is the only allowed source and sets
# CF-Connecting-IP (a caller cannot spoof it); fall back to the socket peer for
# local/non-proxied requests.
map $http_cf_connecting_ip $storingator_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, do not append: a caller-supplied value must never become the
        # rate-limit key. The API reads X-Real-IP (TRUSTED_PROXY_HEADER).
        proxy_set_header X-Real-IP $storingator_client_ip;
        proxy_set_header X-Forwarded-For $storingator_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
